<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频列表 - 精彩视频</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed',
                        secondary: '#06b6d4',
                        dark: '#111827',
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .video-card-hover {
                @apply hover:scale-[1.03] hover:shadow-xl transition-all duration-300 cursor-pointer;
            }
        }
    </style>
</head>
<!-- 导航栏 -->
<body class="bg-gray-900 text-gray-100">
    <nav class="fixed top-0 left-0 w-full z-50 bg-dark/80 backdrop-blur-md border-b border-gray-800">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold text-primary flex items-center gap-2">
            <i class="fa fa-play-circle"></i>AI短剧教学网
        </a>
        <div class="flex gap-6 items-center text-lg">
            <a href="index.html" class="hover:text-primary transition-all duration-300">首页</a>
            <!-- 视频列表：加 active 类 -->
            <a href="video-list.html" class="active text-primary scale-110 font-semibold transition-all duration-300">视频列表</a>
        </div>
    </div>
</nav>


    <main class="pt-24 pb-16 container mx-auto px-4">
        <!-- 搜索框 -->
        <div class="max-w-2xl mx-auto mb-12">
            <h2 class="text-2xl text-center mb-4">搜索视频</h2>
            <div class="relative">
                <input id="searchInput" type="text" placeholder="输入视频名称搜索..."
                    class="w-full px-5 py-3 rounded-full bg-gray-800 border border-gray-700 focus:border-primary outline-none focus:ring-2 focus:ring-primary/40">
                <button id="searchBtn" class="absolute right-2 top-1/2 -translate-y-1/2 bg-primary px-5 py-2 rounded-full hover:bg-purple-600 transition">
                    <i class="fa fa-search mr-1"></i>搜索
                </button>
            </div>
        </div>

        <!-- 视频卡片容器 -->
        <div id="videoContainer" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- JS动态渲染视频卡片 -->
        </div>
        <div id="emptyTip" class="hidden text-center py-16 text-gray-400">
            <i class="fa fa-film text-5xl mb-4"></i>
            <p>没有找到匹配的视频</p>
        </div>
    </main>

    <!-- 视频弹窗播放器 -->
    <div id="videoModal" class="fixed inset-0 z-[999] bg-black/85 hidden items-center justify-center p-4">
        <div class="relative w-full max-w-4xl">
            <button id="closeModal" class="absolute -top-10 right-0 text-white text-2xl hover:text-primary">
                <i class="fa fa-times"></i>
            </button>
            <video id="player" controls class="w-full rounded-lg bg-black"></video>
            <h4 id="videoTitle" class="mt-3 text-lg"></h4>
        </div>
    </div>

    <!-- 底部 -->
    <footer class="bg-dark border-t border-gray-800 py-8">
        <div class="container mx-auto px-4 text-center text-gray-400">
            <p>© 2026 AI短剧教学网</p>
        </div>
    </footer>

    <script>
        // 模拟视频数据
        const videoData = [
            {
                title: "风景航拍短片",
                src: "https://www.w3schools.com/html/mov_bbb.mp4",
                cover: "https://picsum.photos/id/1036/600/340"
            },
            {
                title: "城市延时摄影",
                src: "https://www.w3schools.com/html/mov_bbb.mp4",
                cover: "https://picsum.photos/id/1031/600/340"
            },
            {
                title: "海边日落记录",
                src: "https://www.w3schools.com/html/mov_bbb.mp4",
                cover: "https://picsum.photos/id/1039/600/340"
            },
            {
                title: "山间溪流",
                src: "https://www.w3schools.com/html/mov_bbb.mp4",
                cover: "https://picsum.photos/id/1043/600/340"
            },
            {
                title: "城市夜景",
                src: "https://www.w3schools.com/html/mov_bbb.mp4",
                cover: "https://picsum.photos/id/1044/600/340"
            },
            {
                title: "森林晨雾",
                src: "https://www.w3schools.com/html/mov_bbb.mp4",
                cover: "https://picsum.photos/id/1045/600/340"
            },
        ];

        const container = document.getElementById('videoContainer');
        const emptyTip = document.getElementById('emptyTip');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const videoModal = document.getElementById('videoModal');
        const player = document.getElementById('player');
        const videoTitle = document.getElementById('videoTitle');
        const closeModal = document.getElementById('closeModal');

        // 渲染视频列表
        function render(list) {
            container.innerHTML = '';
            if(list.length === 0) {
                emptyTip.classList.remove('hidden');
                return;
            }
            emptyTip.classList.add('hidden');
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-gray-800 rounded-xl overflow-hidden video-card-hover';
                card.innerHTML = `
                    <div class="relative">
                        <img src="${item.cover}" class="w-full h-48 object-cover">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span class="w-12 h-12 rounded-full bg-black/50 flex items-center justify-center text-white text-xl">
                                <i class="fa fa-play"></i>
                            </span>
                        </div>
                    </div>
                    <div class="p-4">
                        <h3 class="font-semibold">${item.title}</h3>
                    </div>
                `;
                card.onclick = () => {
                    player.src = item.src;
                    videoTitle.innerText = item.title;
                    videoModal.classList.remove('hidden');
                    videoModal.classList.add('flex');
                    player.play();
                }
                container.appendChild(card);
            })
        }

        // 搜索过滤
        function searchVideo() {
            const keyword = searchInput.value.trim().toLowerCase();
            const filterList = videoData.filter(v => v.title.toLowerCase().includes(keyword));
            render(filterList);
        }
        searchBtn.onclick = searchVideo;
        searchInput.onkeyup = (e) => {
            if(e.key === 'Enter') searchVideo();
        }

        // 关闭弹窗
        closeModal.onclick = () => {
            videoModal.classList.add('hidden');
            videoModal.classList.remove('flex');
            player.pause();
            player.src = '';
        }
        videoModal.onclick = (e) => {
            if(e.target === videoModal) closeModal.click();
        }

        // 初始渲染全部视频
        render(videoData);
    </script>
</body>
</html>
